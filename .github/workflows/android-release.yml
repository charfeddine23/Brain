name: Build & Release Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew Executable
        run: chmod +x gradlew || true

      - name: Extract App Version Information
        id: app_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*= *([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          echo "Extracted Version: ${VERSION_NAME} (code: ${VERSION_CODE})"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

      - name: Prepare Release Keystore (Auto-Healing)
        id: keystore_prep
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release.jks"
          DEFAULT_PASS="androidreleasekey2026"
          DEFAULT_ALIAS="habitpulse"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            
            # Read passwords with fallbacks to avoid empty strings
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            if [ -z "$STORE_PASS" ]; then STORE_PASS="${{ secrets.STORE_PASSWORD }}"; fi
            if [ -z "$STORE_PASS" ]; then STORE_PASS="$DEFAULT_PASS"; fi
            
            KEY_AL="${{ secrets.KEY_ALIAS }}"
            if [ -z "$KEY_AL" ]; then KEY_AL="$DEFAULT_ALIAS"; fi
            
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            if [ -z "$KEY_PASS" ]; then KEY_PASS="$STORE_PASS"; fi

            echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_AL=$KEY_AL" >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 secret was not provided. Auto-generating dedicated release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$DEFAULT_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$DEFAULT_PASS" \
              -keypass "$DEFAULT_PASS" \
              -dname "CN=Habit Pulse, OU=Mobile, O=AI Studio, L=Global, S=Global, C=US"
            
            echo "STORE_PASS=$DEFAULT_PASS" >> $GITHUB_ENV
            echo "KEY_AL=$DEFAULT_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$DEFAULT_PASS" >> $GITHUB_ENV
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_ALIAS: ${{ env.KEY_AL }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}

      - name: Locate and Standardize Release APK Filename
        id: organize_apk
        run: |
          FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "Error: Release APK not generated!"
            exit 1
          fi
          RELEASE_NAME="BrainPulse-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}-r${{ github.run_number }}.apk"
          cp "$FOUND_APK" "$RELEASE_NAME"
          echo "FINAL_APK_FILE=$RELEASE_NAME" >> $GITHUB_ENV
          echo "Output Release APK: $RELEASE_NAME"

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
            name: BrainPulse-v${{ env.VERSION_NAME }}-r${{ github.run_number }}
            path: ${{ env.FINAL_APK_FILE }}
            retention-days: 1
            if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: "Brain Pulse v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          generate_release_notes: true
          make_latest: true
          body: |
            ## 🚀 Brain Pulse Release v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})

            ### 📦 Release Information
            - **App Version:** `${{ env.VERSION_NAME }}` (Code: `${{ env.VERSION_CODE }}`)
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Trigger:** Automatic build & release triggered by `${{ github.event_name }}`

            ### 🛡️ Features Included:
            - **100-Level Brain Evolution Engine**: Logarithmic 100-level organic visual brain with quantum aura.
            - **1000-Point Level Pool**: Dynamic unconstrained promotions across levels.
            - **Anti-Cheat Tracking**: Foreground active time only with 60-second minimum session filter.
            - **The 3 Daily Outcomes**: Case A (Clean Sweep), Case B (Single Breach frozen streak), Case C (Multi-Breach with 1000-pt buffer & unrestricted demotion).
            - **Escalating Daily Streak Bonuses**: Up to +2,000 pts/day for long-term discipline.
            - **Self-Package Exclusion**: Time spent in Brain Pulse never triggers penalties.
            - **Liquid Glass Dark Theme**: 4 dynamic glass themes with bilingual English & Arabic.
          files: ${{ env.FINAL_APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


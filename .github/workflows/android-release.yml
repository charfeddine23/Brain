name: Build & Release Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew Executable
        run: chmod +x gradlew || true

      - name: Calculate Dynamic Version
        id: dynamic_version
        run: |
          # Count total commits on current branch for monotonic increment
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          if [ "$COMMIT_COUNT" -lt 1 ]; then COMMIT_COUNT=1; fi
          
          RUN_NUM="${{ github.run_number }}"
          if [ -z "$RUN_NUM" ] || [ "$RUN_NUM" -lt 1 ]; then RUN_NUM=1; fi
          
          # Semantic versioning: 1.<commit_count>.<run_number>
          VERSION_NAME="1.${COMMIT_COUNT}.${RUN_NUM}"
          VERSION_CODE=$((COMMIT_COUNT * 100 + RUN_NUM))
          
          echo "Dynamic Version Name: ${VERSION_NAME}"
          echo "Dynamic Version Code: ${VERSION_CODE}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

      - name: Prepare Fixed Deterministic Signing Keystore
        id: keystore_prep
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release.jks"
          KEY_PASS="androidreleasekey2026"
          KEY_ALIAS="habitpulse"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            STORE_P="${{ secrets.KEYSTORE_PASSWORD }}"
            if [ -z "$STORE_P" ]; then STORE_P="$KEY_PASS"; fi
            ALIAS_P="${{ secrets.KEY_ALIAS }}"
            if [ -z "$ALIAS_P" ]; then ALIAS_P="$KEY_ALIAS"; fi
            PASS_P="${{ secrets.KEY_PASSWORD }}"
            if [ -z "$PASS_P" ]; then PASS_P="$STORE_P"; fi
            
            echo "STORE_PASS=$STORE_P" >> $GITHUB_ENV
            echo "KEY_AL=$ALIAS_P" >> $GITHUB_ENV
            echo "KEY_PASS=$PASS_P" >> $GITHUB_ENV
          elif [ -f "${{ github.workspace }}/debug.keystore" ]; then
            echo "Using repository debug.keystore as fixed signing key for seamless updates across builds..."
            cp "${{ github.workspace }}/debug.keystore" "$KEYSTORE_FILE"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_AL=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          else
            echo "Generating fallback keystore with fixed credentials..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Brain Pulse, OU=Mobile, O=AI Studio, L=Global, S=Global, C=US"
            echo "STORE_PASS=$KEY_PASS" >> $GITHUB_ENV
            echo "KEY_AL=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_ALIAS: ${{ env.KEY_AL }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}

      - name: Format Release APK Filename (Brain.v1.x.x.apk)
        id: organize_apk
        run: |
          FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "Error: Release APK not generated!"
            exit 1
          fi
          # Exact requested format: Brain.v1.x.x.apk
          RELEASE_NAME="Brain.v${{ env.VERSION_NAME }}.apk"
          cp "$FOUND_APK" "$RELEASE_NAME"
          echo "FINAL_APK_FILE=$RELEASE_NAME" >> $GITHUB_ENV
          echo "Formatted Output APK: $RELEASE_NAME"

      - name: Clean Up Old Releases (Keep Only Latest Release)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up prior releases and git tags to maintain only the latest release..."
          # List all existing releases and delete them so only the latest release remains
          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $OLD_RELEASES; do
            echo "Removing old release: $tag"
            gh release delete "$tag" -y --cleanup-tag || true
          done

      - name: Clean Up Old Workflow Runs (Auto-Prune Actions Storage)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning older workflow run logs and artifacts to free up Actions storage..."
          OLD_RUNS=$(gh run list --workflow=android-release.yml --limit 50 --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          CURRENT_RUN="${{ github.run_id }}"
          for run_id in $OLD_RUNS; do
            if [ "$run_id" != "$CURRENT_RUN" ]; then
              echo "Deleting old workflow run: $run_id"
              gh run delete "$run_id" || true
            fi
          done

      - name: Upload Temporary Release APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release
          path: ${{ env.FINAL_APK_FILE }}
          retention-days: 1
          if-no-files-found: warn

      - name: Publish Latest GitHub Release (Brain.v1.x.x.apk)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Brain Pulse v${{ env.VERSION_NAME }}"
          generate_release_notes: true
          make_latest: true
          body: |
            ## 🧠 Brain Pulse v${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }})

            ### 📦 معلومات التحديث
            - **اسم ملف التثبيت:** `${{ env.FINAL_APK_FILE }}`
            - **رقم الإصدار (Version):** `${{ env.VERSION_NAME }}` (Version Code: `${{ env.VERSION_CODE }}`)
            - **طريقة التثبيت:** موقع بنفس شهادة التوقيع الثابتة لتثبيته مباشرة فوق النسخة السابقة دون الحاجة لحذف التطبيق.
            - **حالة التخزين:** تم تنظيف الإصدارات وعمليات التشغيل السابقة ليبقى هذا الإصدار كأحدث نسخة دائماً.

            ### 🎮 محرك اللعبة ونظام التطور:
            - **بدء من الصفر (Fresh Start)**: تم تصفير جميع المستويات والجوائز والألقاب ليبدأ المستخدم من المستوى الأول بشعلة 100% وتحديات حقيقية.
            - **تتبع ذكي ومكافح للغش**: احتساب وقت الشاشة الفعلي في الواجهة فقط وتجاهل الفتح العرضي.
            - **تصميم زجاجي عصري وسلس**: واجهة فائقة الأناقة مع دعم كامل للغة العربية.
          files: ${{ env.FINAL_APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

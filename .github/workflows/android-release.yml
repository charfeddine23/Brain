name: Build & Release Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Calculate Auto-Incrementing Version
        id: dynamic_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          if [ -z "$COMMIT_COUNT" ] || [ "$COMMIT_COUNT" -lt 1 ]; then COMMIT_COUNT=1; fi

          RUN_NUM="${{ github.run_number }}"
          if [ -z "$RUN_NUM" ] || [ "$RUN_NUM" -lt 1 ]; then RUN_NUM=1; fi

          # Semantic format: 1.<commit_count>.<run_number>
          VERSION_NAME="1.${COMMIT_COUNT}.${RUN_NUM}"
          # Strictly monotonic Android versionCode (always > local 1 and all prior runs)
          VERSION_CODE=$((100000 + RUN_NUM))

          echo "Auto Version Name: ${VERSION_NAME}"
          echo "Auto Version Code: ${VERSION_CODE}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

      - name: Prepare Deterministic Signing Keystore (Enables Direct In-Place Updates)
        id: keystore_prep
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release.jks"
          DEFAULT_KEYSTORE_B64=""

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom KEYSTORE_BASE64 from GitHub Secrets..."
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
            STORE_P="${{ secrets.KEYSTORE_PASSWORD }}"
            if [ -z "$STORE_P" ]; then STORE_P="androidreleasekey2026"; fi
            ALIAS_P="${{ secrets.KEY_ALIAS }}"
            if [ -z "$ALIAS_P" ]; then ALIAS_P="habitpulse"; fi
            PASS_P="${{ secrets.KEY_PASSWORD }}"
            if [ -z "$PASS_P" ]; then PASS_P="$STORE_P"; fi

            echo "STORE_PASS=$STORE_P" >> $GITHUB_ENV
            echo "KEY_AL=$ALIAS_P" >> $GITHUB_ENV
            echo "KEY_PASS=$PASS_P" >> $GITHUB_ENV
          elif [ -f "${{ github.workspace }}/debug.keystore.base64" ]; then
            echo "Decoding repository debug.keystore.base64 for deterministic updates..."
            tr -d '\r\n ' < "${{ github.workspace }}/debug.keystore.base64" | base64 --decode > "${{ github.workspace }}/debug.keystore"
            cp "${{ github.workspace }}/debug.keystore" "$KEYSTORE_FILE"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_AL=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          elif [ -f "${{ github.workspace }}/debug.keystore" ]; then
            echo "Using repository debug.keystore for deterministic updates..."
            cp "${{ github.workspace }}/debug.keystore" "$KEYSTORE_FILE"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_AL=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          else
            echo "Using deterministic fallback signing keystore (matches local installs for direct in-place updates)..."
            printf '%s' "$DEFAULT_KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/debug.keystore"
            cp "${{ github.workspace }}/debug.keystore" "$KEYSTORE_FILE"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_AL=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Error: Keystore file is empty or missing!"
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_ALIAS: ${{ env.KEY_AL }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}

      - name: Format & Verify Release APK Filename (Brain.v1.x.x.apk)
        id: organize_apk
        run: |
          FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          if [ -z "$FOUND_APK" ]; then
            echo "Error: Release APK not generated!"
            exit 1
          fi
          RELEASE_NAME="Brain.v${{ env.VERSION_NAME }}.apk"
          cp "$FOUND_APK" "$RELEASE_NAME"
          echo "FINAL_APK_FILE=$RELEASE_NAME" >> $GITHUB_ENV
          echo "Formatted Output APK: $RELEASE_NAME"
          keytool -printcert -jarfile "$RELEASE_NAME" | head -n 10 || true

      - name: Publish Latest GitHub Release (Brain.v1.x.x.apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Brain Pulse v${{ env.VERSION_NAME }}"
          generate_release_notes: true
          make_latest: 'true'
          body: |
            ## 🧠 Brain Pulse v${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }})

            ### 📦 معلومات التحديث
            - **اسم ملف التثبيت:** `${{ env.FINAL_APK_FILE }}`
            - **رقم الإصدار (Version):** `${{ env.VERSION_NAME }}` (Version Code: `${{ env.VERSION_CODE }}`)
            - **التثبيت المباشر:** موقّع بنفس شهادة التوقيع الثابتة لتثبيته مباشرة فوق النسخة السابقة دون حذف التطبيق أو فقدان البيانات.
            - **إدارة التخزين:** تم حذف الإصدارات وسجل التشغيل السابق ليبقى أحدث إصدار فقط.

            ### 🎯 دقة التتبع ومحرك اللعبة
            - **احتساب كل الوقت 100%**: تم إلغاء حد الـ 60 ثانية؛ كل ثانية استخدام فعلي تُحتسب فوراً لنتائج حقيقية ودقيقة.
            - **تحديث تلقائي داخل التطبيق**: تحميل وتثبيت سلس عبر نافذة منبثقة احترافية.
          files: ${{ env.FINAL_APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Old Releases & Tags (Keep Only Latest)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CURRENT_TAG="v${{ env.VERSION_NAME }}"
          echo "Keeping latest release $CURRENT_TAG and deleting all older releases/tags..."
          OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $OLD_RELEASES; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" -y --cleanup-tag || true
            fi
          done
          OLD_TAGS=$(gh api "repos/${{ github.repository }}/tags?per_page=100" -q '.[].name' 2>/dev/null | grep -E '^v[0-9]+\.' || true)
          for tag in $OLD_TAGS; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting lingering tag: $tag"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
            fi
          done

      - name: Clean Up Old Actions History & Artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pruning previous completed workflow runs and artifacts to keep Actions history clean..."
          CURRENT_RUN="${{ github.run_id }}"
          RUN_IDS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" -q '.workflow_runs[] | select(.status == "completed") | .id' 2>/dev/null || true)
          for run_id in $RUN_IDS; do
            if [ "$run_id" != "$CURRENT_RUN" ]; then
              echo "Deleting old workflow run: $run_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${run_id}" >/dev/null 2>&1 || true
            fi
          done
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" -q '.artifacts[].id' 2>/dev/null || true)
          for art_id in $ARTIFACT_IDS; do
            echo "Deleting old artifact: $art_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${art_id}" >/dev/null 2>&1 || true
          done
